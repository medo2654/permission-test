name: SEC-08 fetch-depth probe

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shallow
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read real PR commit count
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}"
          json="$(curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "${api}")"
          commits="$(printf '%s' "$json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commits"])')"
          echo "REAL_PR_COMMITS=${commits}"
          echo "ACTION_FORMULA_DEPTH=$(( commits < 20 ? 20 : commits ))"

      - name: Compare local fetch depths
        run: |
          set -euo pipefail
          git fetch --quiet --depth=20 origin "pull/${{ github.event.pull_request.number }}/head"
          bounded="$(git rev-list --count FETCH_HEAD)"
          git fetch --quiet --depth=1000 origin "pull/${{ github.event.pull_request.number }}/head"
          expanded="$(git rev-list --count FETCH_HEAD)"
          echo "BOUNDED_DEPTH_20_COMMITS=${bounded}"
          echo "UNBOUNDED_INPUT_DEPTH_1000_COMMITS=${expanded}"
          echo "NETWORK_TARGET=github_actions_runner_only"
