name: SEC-08 actual action reachability

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  actual-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shallow PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create harmless Claude executable
        run: |
          cat > "$RUNNER_TEMP/fake-claude" <<'EOF'
          #!/usr/bin/env bash
          echo "FAKE_CLAUDE_EXECUTED=true"
          exit 0
          EOF
          chmod +x "$RUNNER_TEMP/fake-claude"

      - name: Run actual forked action
        id: actual
        uses: medo2654/claude-code-action@main
        env:
          PATH_TO_CLAUDE_CODE_EXECUTABLE: ${{ runner.temp }}/fake-claude
          ANTHROPIC_API_KEY: sk-ant-api03-offline-test-only
        with:
          github_token: ${{ github.token }}
          prompt: "offline SEC-08 reachability probe"
          claude_args: "--model claude-haiku-4-5"
